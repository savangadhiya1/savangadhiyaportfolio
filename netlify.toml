[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/volt/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/volt/*"
  to = "https://chimerical-shortbread-339d3f.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/volt"
  to = "https://chimerical-shortbread-339d3f.netlify.app/"
  status = 301
  force = true

