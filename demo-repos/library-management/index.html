<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Gadhiya Savan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            padding: 2rem;
            text-align: center;
        }
        
        .hero {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ffd700;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .btn {
            background: #ffd700;
            color: #333;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #ffed4e;
            transform: translateY(-2px);
        }
        
        .github-link {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .github-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="https://github.com/savangadhiya1/library-management" target="_blank" class="github-link">
        <i class="fab fa-github"></i> View Source
    </a>
    
    <div class="container">
        <div class="hero">
            <h1>Library Management System</h1>
            <p class="tagline">Complete Library Solution</p>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📚</div>
                    <div>Book Catalog</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">👥</div>
                    <div>Member System</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div>Issue Tracking</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📈</div>
                    <div>Reports</div>
                </div>
            </div>
            
            <div>
                <a href="https://github.com/savangadhiya1" target="_blank" class="btn">
                    <i class="fab fa-github"></i> GitHub Profile
                </a>
                <a href="https://savangadhiya1.github.io/portfolio" target="_blank" class="btn">
                    <i class="fas fa-home"></i> Portfolio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
